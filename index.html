<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>By The Hounds</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="By The Hounds — ritual club label.">
<style>
  :root{--blue:#0019ff;--ink:#0b0b0b;--white:#f5f5f5}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--blue);color:var(--white);font:400 16px/1.5 system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;overflow:hidden}

  /* —— fake cookie modal —— */
  .gate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);z-index:50}
  .panel{width:min(640px,92vw);background:#111;border:1px solid rgba(255,255,255,.2);padding:22px 22px 16px}
  .panel h1{margin:0 0 8px 0;font-size:22px;letter-spacing:.04em}
  .panel p{margin:0 0 10px 0;opacity:.8}
  .row{display:flex;gap:10px;margin-top:8px}
  input[type=text]{flex:1;padding:10px 12px;border:1px solid rgba(255,255,255,.25);background:#0c0c0c;color:#fff}
  button{padding:10px 14px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
  .hint{margin-top:8px;font-size:12px;opacity:.65}

  /* —— main stage —— */
  .stage{position:fixed;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .7s ease;padding-top:2vh}
  .stage.live{opacity:1;pointer-events:auto}
  .hand{
    width:min(54vw,560px);
    max-width:90vw;
    display:block;
    filter:contrast(105%) saturate(110%);
    transition:transform 1.2s ease;
    animation:drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(0,-12px) scale(1.01);}
  }
  .hand:hover{transform:scale(1.03) rotate(.7deg);transition:transform .5s ease;}

  .nav{position:fixed;inset:0;display:flex;align-items:center;justify-content:space-between;padding:24px;pointer-events:none}
  .nav a{pointer-events:auto;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35);padding:6px 8px;font-size:15px;letter-spacing:.04em}
  .nav .left{justify-self:start}
  .nav .right{justify-self:end}
  .rand{position:fixed;right:20px;bottom:18px;padding:8px 11px;border:1px solid rgba(255,255,255,.35);cursor:pointer}
  .tiny{position:fixed;left:20px;bottom:18px;font-size:10px;opacity:.55}

  /* —— input-result animations —— */
  .anim-yes .hand{transform:scale(1.06) rotate(.6deg)}
  .anim-no .hand{animation:shake .5s ease-in-out 0s 1}
  .anim-uh .hand{animation:glitch 1.1s steps(2,end) 0s 1}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    50%{transform:translateX(10px)}
    75%{transform:translateX(-6px)}
  }
  @keyframes glitch{
    0%{filter:hue-rotate(0deg) contrast(110%)}
    30%{transform:translate(-4px,2px) scale(1.01);filter:hue-rotate(40deg)}
    60%{transform:translate(3px,-2px) scale(1.015);filter:hue-rotate(-30deg)}
    100%{transform:none;filter:none}
  }

  /* entrance bloom */
  .bloom{position:fixed;inset:0;background:radial-gradient(1200px 1200px at 50% 50%,rgba(255,255,255,.15),transparent 55%);opacity:0;pointer-events:none;transition:opacity .8s}
  .bloom.show{opacity:1}
</style>
</head>
<body>

<!-- cookie theatre -->
<div class="gate" id="gate">
  <div class="panel">
    <h1>Accept cookies?</h1>
    <p>Type your truth. (We don’t actually set any cookies.)</p>
    <div class="row">
      <input id="answer" type="text" placeholder="yes / no / something unholy">
      <button id="enter">enter</button>
    </div>
    <div class="hint">Try: “yes”, “no”, or… get creative.</div>
  </div>
</div>

<!-- main stage -->
<div class="stage" id="stage">
  <div class="nav">
    <a class="left" href="#" id="music">MUSIC</a>
    <a class="right" href="#" id="store">STORE</a>
  </div>
  <img class="hand" id="hand" src="Hand%20midle1.png" alt="spectral hand on Klein blue">
  <button class="rand" id="rand">?</button>
  <div class="tiny">No cookies. No tracking. No surveillance.</div>
</div>

<div class="bloom" id="bloom"></div>

<script>
  // —— config: set your real links here —— //
  const LINKS_RANDOM = [
    "https://www.nationalarchives.gov.uk/",
    "https://en.wikipedia.org/wiki/Special:Random",
    "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
    "https://www.metmuseum.org/art/collection/search/436105",
    "https://earth.google.com/web/",
    "https://www.amazon.co.uk/s?k=gorilla+mask"
  ];
  const MUSIC_URL = "https://your.bandcamp.com/album/vol1";      // TODO
  const STORE_URL = "https://your.bandcamp.com/merch/relic-1";   // TODO

  // —— elements —— //
  const gate = document.getElementById('gate');
  const stage = document.getElementById('stage');
  const bloom = document.getElementById('bloom');
  const hand = document.getElementById('hand');
  const input = document.getElementById('answer');
  const btn = document.getElementById('enter');
  const music = document.getElementById('music');
  const store = document.getElementById('store');
  const rand = document.getElementById('rand');

  const say = s => (s||"").toLowerCase().trim();

  function reveal(anim){
    if(anim==='yes'){ document.body.classList.add('anim-yes'); }
    else if(anim==='no'){ document.body.classList.add('anim-no'); }
    else { document.body.classList.add('anim-uh'); }

    bloom.classList.add('show');
    setTimeout(()=>{ bloom.classList.remove('show'); }, 900);

    gate.style.display = 'none';
    stage.classList.add('live');
  }

  function handleAnswer(){
    const v = say(input.value);
    if(!v){ input.focus(); return; }

    if(v.includes('fuck')) reveal('uh');
    else if(['y','ye','yeah','yep','yes','ok','sure'].some(k=>v===k || v.includes(k))) reveal('yes');
    else if(['n','nah','nope','no'].some(k=>v===k)) reveal('no');
    else reveal('uh');
  }

  btn.addEventListener('click', handleAnswer);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAnswer(); });

  // nav links
  music.addEventListener('click', e=>{ e.preventDefault(); window.location.href = MUSIC_URL; });
  store.addEventListener('click', e=>{ e.preventDefault(); window.location.href = STORE_URL; });

  // randomiser
  rand.addEventListener('click', ()=>{
    const url = LINKS_RANDOM[Math.floor(Math.random()*LINKS_RANDOM.length)];
    window.open(url, '_blank', 'noopener');
  });
</script>
</body>
</html>
